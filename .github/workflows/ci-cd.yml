name: HUIT ContestFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contestflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/contestflow_ci
      ADMIN_SETUP_KEY: ci-only-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build production application
        run: npm run build

      - name: Package cPanel release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: tar -czf hcf-cpanel-release.tar.gz app.cjs .next public package.json package-lock.json prisma prisma.config.ts next.config.ts src/generated/prisma

      - name: Upload cPanel release artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: hcf-cpanel-release
          path: hcf-cpanel-release.tar.gz
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy to cPanel
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
    steps:
      - name: Download verified release
        uses: actions/download-artifact@v8
        with:
          name: hcf-cpanel-release
          path: release-artifact

      - name: Prepare release archive
        run: cp release-artifact/hcf-cpanel-release.tar.gz hcf-cpanel-release.tar.gz

      - name: Upload release to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: hcf-cpanel-release.tar.gz
          target: /home/uqqwmiabhosting/public_html/contestflow.huitmedia.edu.vn

      - name: Install release and restart Node.js app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            APP_PATH=/home/uqqwmiabhosting/public_html/contestflow.huitmedia.edu.vn
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            node_major=$(node --version | sed -E 's/^v([0-9]+).*/\1/')
            if [ "$node_major" != "22" ]; then
              echo "Expected Node.js 22; found $(node --version)"
              exit 1
            fi
            cd "$APP_PATH"
            tar -xzf hcf-cpanel-release.tar.gz -C "$APP_PATH"
            rm -f hcf-cpanel-release.tar.gz
            npm ci --omit=dev --no-audit --no-fund
            mkdir -p tmp
            touch tmp/restart.txt
