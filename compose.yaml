services:
  mysql:
    image: mysql:8.4
    container_name: contestflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cmjs
      MYSQL_USER: cmjs
      MYSQL_PASSWORD: cmjs_dev
      MYSQL_ROOT_PASSWORD: cmjs_root_dev
    ports:
      - "3306:3306"
    volumes:
      - contestflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contestflow_mysql_data:
